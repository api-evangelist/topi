note: >-
  topi Elements is topi's first-party JavaScript library of custom HTML elements
  (web components) for embedding rental pricing, carts, and checkout into a
  storefront. It wraps the topi Seller API and is opinionated in the spirit of
  Bootstrap / Material UI — developers pass data to elements declaratively rather
  than constructing API requests by hand. Distinct from server-side SDKs.
