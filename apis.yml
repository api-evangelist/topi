name: Topi
description: >-
  topi is a European hardware-as-a-service (HaaS) fintech that lets B2B sellers
  and retailers offer tech devices, IT hardware, and equipment as flexible
  monthly rental subscriptions instead of one-off purchases, across eCommerce,
  telesales, and point-of-sale channels. Merchants embed topi rentals into their
  checkout through the OAuth2-secured topi Seller API (catalog, offers, orders,
  shipments, and shipping methods) and the topi Elements embeddable web
  components, with a dedicated sandbox for end-to-end testing. Backed by Creandum.
