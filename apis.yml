- aid: topi:topi-offer-api
  name: Topi offer API
  description: >-
    Provides operations to handle offers for end-customers.


    ## Webhooks


    ### OfferUpdates


    We will ping the URL provided whenever an offer has changed its status to: `"accepted"`, `"declined"`,
    `"voided"`, `"pending_review"` or `"expired"`.


    **Payload**:


    -  same as [show offer](#tag/offer/operation/offer#show)
        - `id`: `string`
        - `created_at`: `string <date-time>`
        - `status`: `string enum: "accepted" | "declined" | "pending_review" | "voided" | "expired"`
        - `checkout_redirect_url`: `string <uri>`
  humanURL: https://developer.topi.eu/api
  baseURL: https://seller-api.topi.eu
  tags:
  - Offer
  tags_raw:
  - offer
  properties:
  - type: OpenAPI
    url: openapi/topi-offer-api-openapi.yml
- aid: topi:topi-order-api
  name: Topi order API
  description: "Provides operations to handle orders for end-customers.\n\n## Webhooks\n\nWe will ping\
    \ the URL provided whenever an order has changed its status to: `\"created\"`, `\"completed\"`, or\
    \ `\"canceled\"`.\n\n**Payload**:\n\n- Available fields:\n    - `id`: `string`\n    - `assets`: `array`\
    \ of `Asset`\n    - `metadata`: `object`\n    - `offer_id`: `string`\n    - `seller_offer_reference`:\
    \ `string`\n    - `status`: `string enum`\n    - `shipping_address`: `ShippingAddress` \n    \n  \
    \  `ShippingAddress` contains this fields:\n    - `name`: `string`\n    - `line1`: `string`\n    -\
    \ `line2`: `string`\n    - `postal_code`: `string`\n    - `city`: `string`\n    - `region`: `string`\n\
    \    - `country_code`: `string`"
  humanURL: https://developer.topi.eu/api
  baseURL: https://seller-api.topi.eu
  tags:
  - Order
  tags_raw:
  - order
  properties:
  - type: OpenAPI
    url: openapi/topi-order-api-openapi.yml
- aid: topi:topi-shipment-api
  name: Topi shipment API
  description: >-
    #### Assets without serial numbers


    Some assets might not have a serial number (e.g. accessories). In order to send them with the shipment,
    explicitly pass an empty string `""` as the `serial_number` for this asset.


    > Note, that every asset, that has a **rent option**, requires a serial number even if it has been
    directly purchased. The request will fail with an according message if such a serial number is missing.


    > Also note, that every item of an order has to be shipped for the order to be completed. This can
    be done in multiple shipments.
  humanURL: https://developer.topi.eu/api
  baseURL: https://seller-api.topi.eu
  tags:
  - Shipment
  tags_raw:
  - shipment
  properties:
  - type: OpenAPI
    url: openapi/topi-shipment-api-openapi.yml
