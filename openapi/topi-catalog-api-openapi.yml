    CatalogImportCategorization:
      type: object
      properties:
        done:
          type: boolean
          description: True once total > 0 and pending == 0. Mirrors the import.status flip from `ingested` to `completed`.
          example: false
        pending:
          type: integer
          description: Products still in to_be_categorized (async pipeline hasn't reached them yet).
          example: 1
          format: int64
        supported:
          type: integer
          description: Products successfully categorised (review_status = supported).
          example: 1
          format: int64
        to_be_reviewed:
          type: integer
          description: Products where the categoriser was uncertain — manual review needed.
          example: 1
          format: int64
        total:
          type: integer
          description: Total products linked to this import.
          example: 1
          format: int64
        unsupported:
          type: integer
          description: Products explicitly marked unsupported by the categoriser.
          example: 1
          format: int64
      description: 'Per-import categorisation progress.


        Populated once products from the import are in the database (status >= ingested).

        While the import is still processing CSV rows the counts will lag behind the

        final totals; treat them as best-effort snapshots.


        The pipeline runs asynchronously after ingestion: products start in ''to_be_categorized''

        (counted as pending) and move to either ''supported'' (counted as supported) or

        ''to_be_reviewed'' (LLM judge was uncertain — needs human review).'
      example:
        done: false
        pending: 1
        supported: 1
        to_be_reviewed: 1
        total: 1
        unsupported: 1
      required:
      - total
      - pending
      - supported
      - to_be_reviewed
      - unsupported
      - done
