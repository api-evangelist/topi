    CatalogImportJob:
      type: object
      properties:
        categorization:
          $ref: '#/components/schemas/CatalogImportCategorization'
        created_at:
          type: string
          description: ISO 8601 timestamp when the import job was created.
          example: '1970-01-01T00:00:01Z'
          format: date-time
        error:
          type: string
          description: Reason the import failed before row processing started (e.g. a required column is missing), populated when status is 'failed'. Row-level failures are reported via 'failed' and 'errors_url' instead.
          example: abc123
        errors_url:
          type: string
          description: Pre-signed URL to download a CSV file containing rows that failed, populated once the import has finished.
          example: https://example.com/foo
          format: uri
        failed:
          type: integer
          description: Number of rows that failed to import.
          example: 1
          format: int64
        filename:
          type: string
          description: The original filename of the uploaded CSV.
          example: abc123
        id:
          type: string
          description: The import job ID.
          example: 739b63c2-9e58-4964-b38d-4ebb424de242
          format: regexp
          pattern: ^[0-9A-Za-z\-]+$
        object_path:
          type: string
          description: The object path in the storage where the uploaded CSV is located.
          example: https://example.com/foo
          format: uri
        processed:
          type: integer
          description: Total number of rows processed so far.
          example: 1
          format: int64
        status:
          type: string
          description: 'Current status of the import job.


            - pending: job created, waiting for the seller to upload the CSV.

            - queued: CSV uploaded, header validated, waiting for a worker.

            - running: worker is reading rows in chunks and writing them to the DB.

            - ingested: every row has landed in the DB; async categorisation pipeline is running.

            - completed: all products have been categorised (no more ''to_be_categorized'').

            - failed: job hit an unrecoverable error. See the ''error'' field.

            - cancelled: seller cancelled the job via DELETE /imports/:id.'
          example: queued
          enum:
          - pending
          - queued
          - running
          - ingested
          - completed
          - failed
          - cancelled
        succeeded:
          type: integer
          description: Number of rows successfully imported.
          example: 1
          format: int64
        updated_at:
          type: string
          description: ISO 8601 timestamp when the import job was last updated.
          example: '1970-01-01T00:00:01Z'
          format: date-time
      example:
        categorization:
          done: false
          pending: 1
          supported: 1
          to_be_reviewed: 1
          total: 1
          unsupported: 1
        created_at: '1970-01-01T00:00:01Z'
        error: abc123
        errors_url: https://example.com/foo
        failed: 1
        filename: abc123
        id: 739b63c2-9e58-4964-b38d-4ebb424de242
        object_path: https://example.com/foo
        processed: 1
        status: queued
        succeeded: 1
        updated_at: '1970-01-01T00:00:01Z'
      required:
      - id
      - status
      - filename
      - object_path
      - processed
      - succeeded
      - failed
      - created_at
      - updated_at
