      - catalog
      summary: Create a CSV import job
      description: "Creates a new CSV import job and returns the created import id and a pre-signed upload URL.\n\n## Upload flow\n\n1. Call `POST /imports` with the `filename` of your CSV file. The response contains the import\n   `id` and an `upload_url` — a temporary link to upload the file to.\n2. Upload the file with an HTTP `PUT` request to `upload_url`. The request must include two\n   headers: `Content-Type: text/csv` and `x-goog-content-length-range: 0,262144000`. Uploads\n   without them are rejected. The file may be at most **250 MB**.\n3. The file is then checked and processed in the background. Call `GET /imports/{id}` to follow\n   progress. When some rows could not be imported, the response links to a downloadable CSV\n   listing each failed row and the reason. If the file fails the initial check (for example a\n   required column is missing), the import status becomes `failed` and the `error` field\n   explains why.\n\nA seller can have at most **5 imports running** at the same time. Starting a sixth returns a\n`TooManyRequests` error — wait for an earlier import to finish and try again.\n\n## CSV format\n\nThe first line of the file must be a header row with column names. Column names are not\ncase-sensitive and surrounding spaces are ignored; any column not listed below is simply skipped.\n\nRe-uploading a product you imported before (same `reference`) updates that product instead of\ncreating a duplicate. Leaving an optional cell empty on re-import keeps the product's existing\nvalue for that field.\n\n### Required columns\n\nThe import is rejected if any of these are missing from the header.\n\n| Column | Description | Format |\n|---|---|---|\n| `title` | Product name shown to customers | Non-empty text |\n| `reference` | Your product identifier(s) | One or more values joined by `\\|`; count must match `reference_source` |\n| `reference_source` | Source/type of each reference (e.g. `sku`, `ean`) | `\\|`-separated, same count as `reference` |\n| `is_active` | Whether the product is sellable | `true`/`false`, `1`/`0`, `yes`/`no`, `y`/`n` (case-insensitive) |\n| `price_gross` | Sale price incl. VAT | Number > 0, must be >= `price_net` |\n| `price_net` | Sale price excl. VAT | Number > 0 |\n\n### Optional columns\n\n| Column | Description | Format |\n|---|---|---|\n| `currency` | Currency code, e.g. `EUR` | Defaults to the seller currency if blank |\n| `manufacturer` | Brand / maker | Text |\n| `subtitle` | Short tagline under the title | Text |\n| `description` | Long product description | Text, max 2000 characters |\n| `base_rental_price_gross` | Monthly rental price incl. VAT | Number > 0, must be >= net if both set |\n| `base_rental_price_net` | Monthly rental price excl. VAT | Number > 0 |\n| `ean` | EAN barcode | Text |\n| `mpn` | Manufacturer part number | Text |\n| `image_url` | Product image | Valid URL |\n| `seller_category_id` | Your category ID | Text |\n| `seller_category_name` | Your category name | Text |\n| `seller_category_parent_id` | Parent category ID | Text |\n| `seller_product_type` | Product type | One of `hardware`, `software`, `service`, `hardware_built_to_order`, or blank |\n| `shop_product_description_url` | Link to the product page on your shop | Valid URL |\n| `extra_details` | Custom key/value attributes | `key=value` pairs joined by `\\|` |\n\n### Prices\n\n- Prices are written in whole currency units, not cents: `2499.00` means 2,499 euros.\n- `price_gross` (with VAT) must be greater than or equal to `price_net` (without VAT).\n- Both decimal styles are accepted: a point (`1999.99`) or a comma (`1999,99`) before the\n  decimals. Thousands separators are also fine in either style: `1,234.56` and `1.234,56` both\n  mean one thousand two hundred thirty-four euros and 56 cents.\n- One shape cannot be told apart: a value like `1,234` could mean `1.234` or `1234`, so that\n  row is rejected with an error. To avoid this, always write the cents explicitly — `1234.00`\n  (or `1.234,00`) for one thousand two hundred thirty-four euros, `1.23` (or `1,23`) for one\n  euro and 23 cents.\n\n### Notes\n\n- **Multiple references**: a product can carry several identifiers — pipe-separate them in\n  `reference` (e.g. `MBP14-001|0719726100000`) with matching kinds in `reference_source`\n  (e.g. `sku|ean`). The two columns must have an equal number of `|`-separated values.\n- **Duplicate references** within the same file are rejected per row; the rest of the file still\n  imports.\n- A row that fails validation does not stop the import: valid rows still import, and every\n  failed row is listed with its reason in the downloadable error CSV.\n\n### Example\n\n```csv\ntitle,reference,reference_source,is_active,price_gross,price_net,currency,manufacturer,seller_product_type,extra_details\nApple MacBook Pro 14,MBP14-001,sku,true,2499.00,2099.16,EUR,Apple,hardware,color=Space Black|warranty=24 months\nDell UltraSharp Monitor,DELL-U2724|0719726100000,sku|ean,1,649.00,545.38,EUR,Dell,hardware,resolution=3840x2160|panel=IPS\n```\n"
      operationId: catalog#createImport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateImportRequestBody'
            example:
              filename: abc123
      responses:
        '201':
          description: Created response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateImportResult'
