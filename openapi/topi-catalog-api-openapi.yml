paths:
  /v1/catalog/basket/pricing:
    post:
      tags:
      - catalog
      summary: Calculate pricing for a whole basket
      description: '## <span style="color:#cc3333">*Deprecated*</span>


        Calculate pricing endpoint is being replaced by two other endpoints:

        - listRecommendedRentalPrices

        - cartRentalOverview


        Please make sure to migrate to one of the above endpoints based on your use case.



        ### Description


        calculate the price for a product'
      operationId: catalog#calculateBasketPricing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalculateBasketPricingRequestBody'
            example:
              pricing_requests:
              - base_rental_price:
                  currency: EUR
                  gross: 119000
                  net: 100000
                  tax_rate: 1900
                identifier: abc123
                price:
                  currency: EUR
                  gross: 119000
                  net: 100000
                  tax_rate: 1900
                quantity: 1
                seller_product_reference:
                  reference: 123ab-5343
                  source: sap
                sublines:
                - base_rental_price:
                    currency: EUR
                    gross: 119000
                    net: 100000
                    tax_rate: 1900
                  price:
                    currency: EUR
                    gross: 119000
                    net: 100000
                    tax_rate: 1900
                  seller_product_reference:
                    reference: 123ab-5343
                    source: sap
      responses:
        '200':
          description: OK response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalculateBasketPricingResponseBody'
              example:
                basket_total_pay_now:
                  currency: EUR
                  gross: 119000
                  net: 100000
                  tax_rate: 1900
                basket_total_rent:
                  currency: EUR
                  gross: 119000
                  net: 100000
                  tax_rate: 1900
                summaries:
                - available_contract_types:
                  - rent
                  default_tenure: 1
                  identifier: abc123
                  is_supported: true
                  pay_now:
                    amount:
                      currency: EUR
                      gross: 119000
                      net: 100000
                      tax_rate: 1900
                    id: 739b63c2-9e58-4964-b38d-4ebb424de242
                  pay_now_excluding_sublines:
                    amount:
                      currency: EUR
                      gross: 119000
                      net: 100000
                      tax_rate: 1900
                    id: 739b63c2-9e58-4964-b38d-4ebb424de242
                  rent:
                  - duration: 12
                    id: 739b63c2-9e58-4964-b38d-4ebb424de242
                    monthly_amount:
                      currency: EUR
                      gross: 119000
                      net: 100000
                      tax_rate: 1900
                  rent_excluding_sublines:
                  - duration: 12
                    id: 739b63c2-9e58-4964-b38d-4ebb424de242
                    monthly_amount:
                      currency: EUR
                      gross: 119000
                      net: 100000
                      tax_rate: 1900
                  sublines:
                  - available_contract_types:
                    - rent
                    default_tenure: 1
                    identifier: abc123
                    is_supported: true
                    pay_now:
                      amount:
                        currency: EUR
                        gross: 119000
                        net: 100000
                        tax_rate: 1900
                      id: 739b63c2-9e58-4964-b38d-4ebb424de242
                    rent:
                    - duration: 12
                      id: 739b63c2-9e58-4964-b38d-4ebb424de242
                      monthly_amount:
                        currency: EUR
                        gross: 119000
                        net: 100000
                        tax_rate: 1900
                    summary: Rent with topi for €24.32/month
                    total_pay_now:
                      amount:
                        currency: EUR
                        gross: 119000
                        net: 100000
                        tax_rate: 1900
                      id: 739b63c2-9e58-4964-b38d-4ebb424de242
                    total_rent:
                    - duration: 12
                      id: 739b63c2-9e58-4964-b38d-4ebb424de242
                      monthly_amount:
                        currency: EUR
                        gross: 119000
                        net: 100000
                        tax_rate: 1900
                  summary: Rent with topi for €24.32/month
                  total_pay_now:
                    amount:
                      currency: EUR
                      gross: 119000
                      net: 100000
                      tax_rate: 1900
                    id: 739b63c2-9e58-4964-b38d-4ebb424de242
                  total_rent:
                  - duration: 12
                    id: 739b63c2-9e58-4964-b38d-4ebb424de242
                    monthly_amount:
                      currency: EUR
                      gross: 119000
                      net: 100000
                      tax_rate: 1900
        '400':
          description: 'BadRequest: Bad Request response.'
          content:
            application/vnd.goa.error:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 'Unauthorized: Unauthorized response.'
          content:
            application/json:
              schema:
                type: string
                example: abc123
              example: abc123
        '403':
          description: 'InvalidScopes: Forbidden response.'
          content:
            application/json:
              schema:
                type: string
                example: abc123
              example: abc123
