      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartRentalOverviewRequestBody'
            example:
              products:
              - base_rental_price:
                  currency: EUR
                  gross: 119000
                  net: 100000
                  tax_rate: 1900
                price:
                  currency: EUR
                  gross: 119000
                  net: 100000
                  tax_rate: 1900
                quantity: 1
                seller_product_reference:
                  reference: 123ab-5343
                  source: sap
