              example:
                can_checkout: false
                currency: EUR
                product_prices:
                - available_rental_terms:
                  - duration: 12
                    id: 739b63c2-9e58-4964-b38d-4ebb424de242
                    monthly_amount:
                      currency: EUR
                      gross: 119000
                      net: 100000
                      tax_rate: 1900
