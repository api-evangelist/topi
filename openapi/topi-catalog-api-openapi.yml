                  currency: EUR
                  has_rental_terms: false
                  quantity: 1
                  seller_product_reference:
                    reference: 123ab-5343
                    source: sap
                  summary: Rent with topi from €23.45/month
                  total_rental_amount: 1
                total_rental_amount: 1
                total_rental_summary: Rent with topi from €123.45/month
