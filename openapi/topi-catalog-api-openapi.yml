components:
  schemas:
    RentContractTerm:
      type: object
      properties:
        duration:
          type: integer
          description: Duration of the rental term in months.
          example: 12
          enum:
          - 6
          - 12
          - 24
          - 36
          format: int64
        id:
          type: string
          description: The internal Id for the contract term
          example: 739b63c2-9e58-4964-b38d-4ebb424de242
          format: regexp
          pattern: ^[0-9A-Za-z\-]+$
        monthly_amount:
          $ref: '#/components/schemas/MoneyAmountWithRequiredTax'
      example:
        duration: 12
        id: 739b63c2-9e58-4964-b38d-4ebb424de242
        monthly_amount:
          currency: EUR
          gross: 119000
          net: 100000
          tax_rate: 1900
      required:
      - monthly_amount
      - duration
    MoneyAmount:
      type: object
      properties:
        currency:
          type: string
          description: 'Currency code, see ISO 4127 (https://www.iso.org/iso-4217-currency-codes.html) (supported: EUR, GBP, USD)'
          example: EUR
        gross:
          type: integer
          description: Gross amount of money, expressed in the minor unit for the currency
          example: 119000
          format: int64
        net:
          type: integer
          description: Net amount of money, expressed in the minor unit for the currency
          example: 100000
          format: int64
      example:
        currency: EUR
        gross: 119000
        net: 100000
      required:
      - gross
      - net
      - currency
    CreateImportResult:
      type: object
      properties:
        id:
          type: string
          description: The import job ID.
          example: 739b63c2-9e58-4964-b38d-4ebb424de242
          format: regexp
          pattern: ^[0-9A-Za-z\-]+$
        upload_url:
          type: string
          description: The upload url in the storage where the uploaded CSV is located.
          example: https://example.com/foo
          format: uri
      example:
        id: 739b63c2-9e58-4964-b38d-4ebb424de242
        upload_url: https://example.com/foo
      required:
      - id
      - upload_url
    FilteringOption:
