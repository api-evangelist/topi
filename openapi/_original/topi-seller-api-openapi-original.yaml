      summary: Create an offer
      description: >
        Creates a topi offer.


        Returns HTTP 200 plus basic information about the offer on success.


        The request returns an HTTP Unprocessable Entity in the following
        scenarios:


        - When `"lines"` is an empty array.

        - When `"lines"` contains any products that are not available in the
        topi catalog

        - When the `"seller_offer_reference"` is reusing a value of an offer
        that is currently active


        ## When using in the Sandbox


        The following seller offer references are considered to be "active":


        - `"ref-1234"`


        The following seller product references are considered to be available
        in the catalog:


        - `{"source": "sap", "reference": "123"}`

        - `{"source": "sap", "reference": "456"}`

        - `{"source": "sku", "reference": "123abc"}`


        The following seller product references are considered to be available
        in the catalog but not supported:


        - `{"source": "sku", "reference": "unsupported-1"}`


        The following shipping reference is considered to be available but not
        supported:


        - `"unsupported-shipping-reference"`
