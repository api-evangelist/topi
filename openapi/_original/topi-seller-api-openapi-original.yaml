          default: false
          example: false
      description: Metadata about the returned page
      example:
        has_more: false
      required:
        - has_more
    CursorPagePayload:
      type: object
      properties:
        ending_before:
          type: string
          description: >-
            A cursor to use in pagination. It will be the ending point of the
            list and will not be included in the results.
          example: 739b63c2-9e58-4964-b38d-4ebb424de242
          format: regexp
          pattern: ^[0-9A-Za-z\-]+$
        limit:
          type: integer
          description: How many results to return per page.
          default: 0
          example: 10
          format: int64
          minimum: 0
        page:
          type: integer
          description: Which page number to fetch (zero-indexed)
          default: 0
          example: 0
          format: int64
        starting_after:
          type: string
          description: >-
            A cursor to use in pagination. It will be the starting point of the
            list and will not be included in the results.
          example: 739b63c2-9e58-4964-b38d-4ebb424de242
          format: regexp
          pattern: ^[0-9A-Za-z\-]+$
      example:
        ending_before: 739b63c2-9e58-4964-b38d-4ebb424de242
        limit: 10
        page: 0
        starting_after: 739b63c2-9e58-4964-b38d-4ebb424de242
