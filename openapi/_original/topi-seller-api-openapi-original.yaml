        Returns HTTP 200 plus basic information about the newly created shipping
        method.


        The request returns an HTTP Unprocessable Entity when the provided
        `"seller_shipping_method_reference"` is not unique.


        ## When using in the Sandbox


        The following seller shipping method references are considered to be
        available and will make the API return an HTTP Unprocessable Entity
        error.


        - `"Bridges"`


