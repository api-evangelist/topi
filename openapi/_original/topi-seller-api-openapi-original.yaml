        Calculate pricing endpoint is being replaced by two other endpoints:

        - listRecommendedRentalPrices

        - cartRentalOverview


        Please make sure to migrate to one of the above endpoints based on your
        use case.



        ### Description


        calculate the price for a product
      operationId: catalog#calculateBasketPricing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalculateBasketPricingRequestBody'
            example:
              pricing_requests:
                - base_rental_price:
                    currency: EUR
                    gross: 119000
                    net: 100000
                    tax_rate: 1900
                  identifier: abc123
                  price:
                    currency: EUR
                    gross: 119000
                    net: 100000
                    tax_rate: 1900
                  quantity: 1
                  seller_product_reference:
                    reference: 123ab-5343
                    source: sap
