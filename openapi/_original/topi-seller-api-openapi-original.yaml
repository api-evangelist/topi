            seller-shipping-method:read: read seller shipping method details
            user-info:read: read user info
tags:
  - name: catalog
    description: Topi catalog for sellers
  - name: offer
    description: >
      Provides operations to handle offers for end-customers.


      ## Webhooks


      ### OfferUpdates


      We will ping the URL provided whenever an offer has changed its status to:
      `"accepted"`, `"declined"`, `"voided"`, `"pending_review"` or `"expired"`.


      **Payload**:


      -  same as [show offer](#tag/offer/operation/offer#show)
          - `id`: `string`
          - `created_at`: `string <date-time>`
          - `status`: `string enum: "accepted" | "declined" | "pending_review" | "voided" | "expired"`
          - `checkout_redirect_url`: `string <uri>`
  - name: order
    description: >
      Provides operations to handle orders for end-customers.


      ## Webhooks


      We will ping the URL provided whenever an order has changed its status to:
      `"created"`, `"completed"`, or `"canceled"`.


      **Payload**:


      - Available fields:
          - `id`: `string`
          - `assets`: `array` of `Asset`
          - `metadata`: `object`
          - `offer_id`: `string`
          - `seller_offer_reference`: `string`
          - `status`: `string enum`
          - `shipping_address`: `ShippingAddress` 
          
          `ShippingAddress` contains this fields:
          - `name`: `string`
          - `line1`: `string`
          - `line2`: `string`
          - `postal_code`: `string`
          - `city`: `string`
          - `region`: `string`
          - `country_code`: `string`
  - name: shipment
    description: >-
      #### Assets without serial numbers


      Some assets might not have a serial number (e.g. accessories). In order to
      send them with the shipment, explicitly pass an empty string `""` as the
      `serial_number` for this asset.


      > Note, that every asset, that has a **rent option**, requires a serial
      number even if it has been directly purchased. The request will fail with
      an according message if such a serial number is missing.


      > Also note, that every item of an order has to be shipped for the order
      to be completed. This can be done in multiple shipments.
  - name: shippingMethod
    description: |
      Provides operations to handle shipping-related tasks.
