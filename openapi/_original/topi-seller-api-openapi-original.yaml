                    "reference": "123ab-5343",
                    "source": "sap"
                  },
                  "sublines": [
                    {
                      "base_rental_price": {
                        "currency": "EUR",
                        "gross": 119000,
                        "net": 100000,
                        "tax_rate": 1900
                      },
                      "price": {
                        "currency": "EUR",
                        "gross": 119000,
