  /v1/offers/paginated:
    get:
      tags:
        - offer
      summary: List all offers with pagination
      description: >-
        Lists the offers created by the calling seller, with pagination and
        filters. Supports offset-based pagination (page/limit) and range filters
        for efficient data traversal. 


        **Recommended approach for paginating over all data:** Use ID range
        filters with limit=100. The ID range filter (id_gt) works like
        cursor-based pagination, providing the most efficient way to iterate
        through the complete dataset. Pass the last ID from the previous page as
        id_gt to fetch the next batch. 


        Examples:

        - First page: ?limit=100

        - Next page: ?id_gt=<last_id_from_previous_page>&limit=100

        - Time-based sync: ?created_at_gt=<last_sync_time>&limit=100
