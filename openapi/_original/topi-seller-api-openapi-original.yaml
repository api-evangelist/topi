  /v1/catalog/check-supported:
    post:
      tags:
        - catalog
      summary: Check if products are supported
      description: >
        Checks whether the products with the given references are supported or
        not.


        ### When using in the Sandbox


        Returns the requested products with their available contract terms,
        depending on the combination of the supplied Source and Reference
        values:


        - To get a product with `PayNow` contract terms : The supplied `source`
        should be `SAP` with `reference` specified as `1234-5678`.

        - To get a product with `Rent` contract terms : There are two ways to
        get this value either when the supplied `source` is `SAP` and the
        `reference` is `1111-1111` or with `source` set to `B6` and `reference`
        specified as `2222-2222`.

        - To get a product that is not topi supported: Specify the `source` as
        `SAP` and `reference` should be `8765-4321`.


        In other cases this method will return an empty array.


        This method has been defined as POST because the size of the input
        values could grow fast.
      operationId: catalog#checkSupported
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckSupportedRequestBody'
            example:
              seller_product_references:
                - reference: 123ab-5343
                  source: sap
      responses:
        '200':
          description: OK response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductsSummary'
              example:
                products:
                  - available_contract_terms:
                      can_pay_now: false
                      can_rent: false
                      rent:
                        duration: 1
                    id: 739b63c2-9e58-4964-b38d-4ebb424de242
                    is_supported: false
                    seller_product_reference:
                      reference: 123ab-5343
                      source: sap
        '401':
          description: 'Unauthorized: Unauthorized response.'
          content:
            application/json:
              schema:
                type: string
                example: abc123
              example: abc123
        '403':
          description: 'InvalidScopes: Forbidden response.'
          content:
            application/json:
              schema:
                type: string
                example: abc123
              example: abc123
      security:
        - OAuth2Seller_header_Authorization:
            - seller-catalog:read
      x-code-samples:
        - lang: curl
          label: cURL
          source: |
            curl -X POST https://seller-api.topi.eu/v1/catalog/check-supported \
              -H "Authorization: Bearer $ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{
              "seller_product_references": [
                {
                  "reference": "123ab-5343",
                  "source": "sap"
                }
              ]
            }'
        - lang: javascript
          label: JavaScript (fetch)
          source: >
            const response = await
            fetch('https://seller-api.topi.eu/v1/catalog/check-supported', {
              method: 'POST',
              headers: {
                'Authorization': `Bearer ${ACCESS_TOKEN}`,
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({
              "seller_product_references": [
                {
                  "reference": "123ab-5343",
                  "source": "sap"
                }
              ]
            })

            });


            const data = await response.json();

            console.log(data);
  /v1/catalog/import:
    post:
      tags:
        - catalog
      summary: Import products into the catalog
      description: >
        Add a batch of products to the catalog.


        ### When using in the Sandbox


        Use the following scenarios to get different fixtures:


        - Status `"completed"`: `Send a catalog with less than 10 products`

        - Status `"created"`: `Send a catalog with 10 products or more`

        - Status `"failed"`: `Send a product inside the catalog with the
        "source" or the "reference" in the "seller_product_reference" as empty
        string`
