        '200':
          description: OK response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalculateBasketPricingResponseBody'
              example:
                basket_total_pay_now:
                  currency: EUR
                  gross: 119000
                  net: 100000
                  tax_rate: 1900
                basket_total_rent:
                  currency: EUR
                  gross: 119000
                  net: 100000
                  tax_rate: 1900
                summaries:
                  - available_contract_types:
                      - rent
                    default_tenure: 1
                    identifier: abc123
                    is_supported: true
                    pay_now:
                      amount:
                        currency: EUR
                        gross: 119000
                        net: 100000
                        tax_rate: 1900
                      id: 739b63c2-9e58-4964-b38d-4ebb424de242
                    pay_now_excluding_sublines:
                      amount:
                        currency: EUR
                        gross: 119000
                        net: 100000
                        tax_rate: 1900
                      id: 739b63c2-9e58-4964-b38d-4ebb424de242
                    rent:
                      - duration: 12
                        id: 739b63c2-9e58-4964-b38d-4ebb424de242
                        monthly_amount:
                          currency: EUR
                          gross: 119000
                          net: 100000
                          tax_rate: 1900
                    rent_excluding_sublines:
                      - duration: 12
                        id: 739b63c2-9e58-4964-b38d-4ebb424de242
                        monthly_amount:
                          currency: EUR
                          gross: 119000
                          net: 100000
                          tax_rate: 1900
                    sublines:
                      - available_contract_types:
                          - rent
                        default_tenure: 1
                        identifier: abc123
                        is_supported: true
                        pay_now:
                          amount:
                            currency: EUR
                            gross: 119000
                            net: 100000
                            tax_rate: 1900
                          id: 739b63c2-9e58-4964-b38d-4ebb424de242
                        rent:
