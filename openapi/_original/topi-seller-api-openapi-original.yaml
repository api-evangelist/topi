                            monthly_amount:
                              currency: EUR
                              gross: 119000
                              net: 100000
                              tax_rate: 1900
                        summary: Rent with topi for €24.32/month
                        total_pay_now:
                          amount:
                            currency: EUR
                            gross: 119000
                            net: 100000
                            tax_rate: 1900
                          id: 739b63c2-9e58-4964-b38d-4ebb424de242
                        total_rent:
                          - duration: 12
                            id: 739b63c2-9e58-4964-b38d-4ebb424de242
                            monthly_amount:
                              currency: EUR
                              gross: 119000
                              net: 100000
                              tax_rate: 1900
                    summary: Rent with topi for €24.32/month
                    total_pay_now:
                      amount:
                        currency: EUR
                        gross: 119000
                        net: 100000
                        tax_rate: 1900
                      id: 739b63c2-9e58-4964-b38d-4ebb424de242
                    total_rent:
