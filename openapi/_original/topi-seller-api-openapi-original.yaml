  /v1/offers/{id}/void:
    post:
      tags:
        - offer
      summary: Void an offer
      description: >
        Voids an offer. Optionally, marks an existing offer as superseding this
        one.


        All offers can be voided except those with status `accepted`. A HTTP 402
        Unprocesssable Entity error will be returned in this case.


        If the **superseding offer** ID does not exist or has the same ID has
        the voided offer, HTTP 402 Unprocessable Entity will be returned.


        ## When using in the Sandbox


        You can use the following IDs to refer to different offer fixtures and
        test this endpoint. Remember that URL's must be encoded.


        - Status `"created"`: `"739b63c2-9e58-4964-b38d-4ebb424de242"`

        - Status `"voided"`: `"ddd454b6-f23b-4f9c-a36d-74964766c3d6"`

        - Status `"expired"`: `"3beec7f7-a258-4260-8713-6c2635e5eea5"`

        - Status `"accepted"`: `"60412bcf-8213-4804-841e-f3c36ce46394"`


        Keep in mind that the Sandbox does _not_ persist state. Even if you void
        an offer, subsequent calls to different API endpoints will yield the
        same results.
      operationId: offer#void
      parameters:
        - name: id
          in: path
          description: topi offer ID
          required: true
          schema:
            type: string
            description: topi offer ID
            example: 739b63c2-9e58-4964-b38d-4ebb424de242
            format: regexp
            pattern: ^[0-9A-Za-z\-]+$
          example: 739b63c2-9e58-4964-b38d-4ebb424de242
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoidRequestBody'
            example:
              superseded_by_id: 739b63c2-9e58-4964-b38d-4ebb424de242
      responses:
        '200':
          description: OK response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfferResult'
              examples:
                A voided offer:
                  summary: A voided offer
                  value:
                    created_at: '1971-05-24T04:42:31Z'
        '400':
          description: 'BadRequest: Bad Request response.'
          content:
            application/vnd.goa.error:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 'Unauthorized: Unauthorized response.'
          content:
            application/json:
              schema:
                type: string
                example: abc123
              example: abc123
        '403':
          description: 'InvalidScopes: Forbidden response.'
          content:
            application/json:
              schema:
                type: string
                example: abc123
              example: abc123
        '404':
          description: 'NotFound: Not Found response.'
          content:
            application/vnd.goa.error:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 'Unprocessable: Unprocessable Entity response.'
          content:
            application/vnd.goa.error:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - OAuth2Seller_header_Authorization:
            - seller-offer:edit
      x-code-samples:
        - lang: curl
          label: cURL
          source: |
            curl -X POST https://seller-api.topi.eu/v1/offers/{id}/void \
              -H "Authorization: Bearer $ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{
              "superseded_by_id": "739b63c2-9e58-4964-b38d-4ebb424de242"
            }'
        - lang: javascript
          label: JavaScript (fetch)
          source: >
            const response = await
            fetch('https://seller-api.topi.eu/v1/offers/{id}/void', {
              method: 'POST',
              headers: {
                'Authorization': `Bearer ${ACCESS_TOKEN}`,
                'Content-Type': 'application/json'
