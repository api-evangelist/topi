openapi: 3.0.3
info:
  title: topi Seller API
  description: >
    # Localization


    Strings returned can be localized when the _Accept-Language_ header is
    provided in the request. It should follow the [RFC-2616
    convention](http://www.ietf.org/rfc/rfc2616.txt).
  version: 1.0.0
servers:
  - url: https://seller-api-sandbox.topi-sandbox.eu
  - url: https://seller-api.topi.eu
  - url: https://seller-api.topi-staging.eu
  - url: https://seller-api-sandbox.topi-sandbox-staging.eu
paths:
