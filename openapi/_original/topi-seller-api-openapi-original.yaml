  /v1/catalog/imports:
    post:
      tags:
        - catalog
      summary: Create a CSV import job
      description: >
        Creates a new CSV import job and returns the created import id and a
        pre-signed upload URL.


        ## Upload flow


        1. Call `POST /imports` with the `filename` of your CSV file. The
        response contains the import
           `id` and an `upload_url` — a temporary link to upload the file to.
        2. Upload the file with an HTTP `PUT` request to `upload_url`. The
        request must include two
           headers: `Content-Type: text/csv` and `x-goog-content-length-range: 0,262144000`. Uploads
           without them are rejected. The file may be at most **250 MB**.
        3. The file is then checked and processed in the background. Call `GET
        /imports/{id}` to follow
           progress. When some rows could not be imported, the response links to a downloadable CSV
           listing each failed row and the reason. If the file fails the initial check (for example a
           required column is missing), the import status becomes `failed` and the `error` field
           explains why.

        A seller can have at most **5 imports running** at the same time.
        Starting a sixth returns a

        `TooManyRequests` error — wait for an earlier import to finish and try
        again.


        ## CSV format


        The first line of the file must be a header row with column names.
        Column names are not

        case-sensitive and surrounding spaces are ignored; any column not listed
        below is simply skipped.


        Re-uploading a product you imported before (same `reference`) updates
        that product instead of

        creating a duplicate. Leaving an optional cell empty on re-import keeps
        the product's existing

        value for that field.


        ### Required columns


        The import is rejected if any of these are missing from the header.


        | Column | Description | Format |

        |---|---|---|

        | `title` | Product name shown to customers | Non-empty text |

        | `reference` | Your product identifier(s) | One or more values joined
        by `\|`; count must match `reference_source` |

        | `reference_source` | Source/type of each reference (e.g. `sku`, `ean`)
        | `\|`-separated, same count as `reference` |

        | `is_active` | Whether the product is sellable | `true`/`false`,
        `1`/`0`, `yes`/`no`, `y`/`n` (case-insensitive) |

        | `price_gross` | Sale price incl. VAT | Number > 0, must be >=
        `price_net` |

        | `price_net` | Sale price excl. VAT | Number > 0 |


        ### Optional columns


        | Column | Description | Format |

        |---|---|---|

        | `currency` | Currency code, e.g. `EUR` | Defaults to the seller
        currency if blank |

        | `manufacturer` | Brand / maker | Text |

        | `subtitle` | Short tagline under the title | Text |

        | `description` | Long product description | Text, max 2000 characters |

        | `base_rental_price_gross` | Monthly rental price incl. VAT | Number >
        0, must be >= net if both set |

        | `base_rental_price_net` | Monthly rental price excl. VAT | Number > 0
        |

        | `ean` | EAN barcode | Text |

        | `mpn` | Manufacturer part number | Text |

        | `image_url` | Product image | Valid URL |

        | `seller_category_id` | Your category ID | Text |

        | `seller_category_name` | Your category name | Text |

        | `seller_category_parent_id` | Parent category ID | Text |

        | `seller_product_type` | Product type | One of `hardware`, `software`,
        `service`, `hardware_built_to_order`, or blank |

        | `shop_product_description_url` | Link to the product page on your shop
        | Valid URL |

        | `extra_details` | Custom key/value attributes | `key=value` pairs
        joined by `\|` |


        ### Prices


        - Prices are written in whole currency units, not cents: `2499.00` means
        2,499 euros.

        - `price_gross` (with VAT) must be greater than or equal to `price_net`
        (without VAT).

        - Both decimal styles are accepted: a point (`1999.99`) or a comma
        (`1999,99`) before the
          decimals. Thousands separators are also fine in either style: `1,234.56` and `1.234,56` both
          mean one thousand two hundred thirty-four euros and 56 cents.
        - One shape cannot be told apart: a value like `1,234` could mean
        `1.234` or `1234`, so that
          row is rejected with an error. To avoid this, always write the cents explicitly — `1234.00`
          (or `1.234,00`) for one thousand two hundred thirty-four euros, `1.23` (or `1,23`) for one
          euro and 23 cents.

        ### Notes


        - **Multiple references**: a product can carry several identifiers —
        pipe-separate them in
          `reference` (e.g. `MBP14-001|0719726100000`) with matching kinds in `reference_source`
          (e.g. `sku|ean`). The two columns must have an equal number of `|`-separated values.
        - **Duplicate references** within the same file are rejected per row;
        the rest of the file still
          imports.
        - A row that fails validation does not stop the import: valid rows still
        import, and every
          failed row is listed with its reason in the downloadable error CSV.

        ### Example


        ```csv

        title,reference,reference_source,is_active,price_gross,price_net,currency,manufacturer,seller_product_type,extra_details

        Apple MacBook Pro
        14,MBP14-001,sku,true,2499.00,2099.16,EUR,Apple,hardware,color=Space
        Black|warranty=24 months

        Dell UltraSharp
        Monitor,DELL-U2724|0719726100000,sku|ean,1,649.00,545.38,EUR,Dell,hardware,resolution=3840x2160|panel=IPS

        ```
      operationId: catalog#createImport
      requestBody:
        required: true
        content:
          application/json:
            schema:
