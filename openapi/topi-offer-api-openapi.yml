                  net: 100000
                bundle_index: abc123
                price:
                  currency: EUR
                  gross: 119000
                  net: 100000
                product_id: abc123
                quantity: 2
                seller_product_reference:
                  reference: 123ab-5343
                  source: sap
                sub_lines:
                - base_rental_price:
                    currency: EUR
                    gross: 119000
