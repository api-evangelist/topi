components:
  schemas:
    RentContractTerm:
      type: object
      properties:
        duration:
          type: integer
          description: Duration of the rental term in months.
          example: 12
          enum:
          - 6
          - 12
          - 24
          - 36
          format: int64
        id:
          type: string
          description: The internal Id for the contract term
          example: 739b63c2-9e58-4964-b38d-4ebb424de242
          format: regexp
          pattern: ^[0-9A-Za-z\-]+$
        monthly_amount:
          $ref: '#/components/schemas/MoneyAmountWithRequiredTax'
      example:
        duration: 12
        id: 739b63c2-9e58-4964-b38d-4ebb424de242
        monthly_amount:
          currency: EUR
          gross: 119000
          net: 100000
          tax_rate: 1900
      required:
      - monthly_amount
      - duration
    PaginationMetadata:
      type: object
      properties:
        page:
          type: integer
          description: Current page number
          example: 1
          format: int64
        page_size:
          type: integer
          description: Number of items per page
          example: 1
          format: int64
        total_count:
          type: integer
          description: Total number of items
          example: 1
          format: int64
        total_pages:
          type: integer
          description: Total number of pages
          example: 1
          format: int64
      example:
        page: 1
        page_size: 1
        total_count: 1
        total_pages: 1
    MoneyAmount:
      type: object
      properties:
        currency:
          type: string
          description: 'Currency code, see ISO 4127 (https://www.iso.org/iso-4217-currency-codes.html) (supported: EUR, GBP, USD)'
          example: EUR
        gross:
          type: integer
          description: Gross amount of money, expressed in the minor unit for the currency
          example: 119000
          format: int64
        net:
          type: integer
          description: Net amount of money, expressed in the minor unit for the currency
          example: 100000
          format: int64
      example:
        currency: EUR
        gross: 119000
        net: 100000
      required:
      - gross
      - net
      - currency
    SalesAgent:
      type: object
      properties:
        email:
          type: string
          description: E-mail
          example: alice@example.com
          format: email
        external_agent_id:
          type: string
          description: Id number used to identify the sales agent in the seller's internal system
          example: abc123
        name:
          type: string
          description: Name of the agent
          example: abc123
        phone:
          type: string
          description: Phone number
          example: abc123
      description: Sales agent related to an offer
      example:
        email: alice@example.com
        external_agent_id: abc123
        name: abc123
        phone: abc123
      required:
      - name
      - phone
      - email
    PricingOverview:
      type: object
      properties:
        breakdown:
          type: array
          items:
            $ref: '#/components/schemas/BreakdownLine'
