                    source: sap
                  subtitle: abc123
                  title: abc123
                subtitle: abc123
                title: abc123
              metadata:
                affiliate_code: '123456'
              sales_agent:
                email: alice@example.com
                external_agent_id: abc123
                name: abc123
                phone: abc123
