          - amount:
              currency: EUR
              gross: 119000
              net: 100000
            title: Monthly (x36)
            tooltip: The first rent fee is included in the first payment. More details later, in topi checkout.
        instead_of_amount:
          $ref: '#/components/schemas/MoneyAmount'
        items_summaries:
          type: array
          items:
            $ref: '#/components/schemas/ItemSummary'
          description: 'Price summary for each item: main line and sublines.'
          example:
          - identifier: abc123
            pay_now:
              pay_now_amount:
                currency: EUR
                gross: 119000
                net: 100000
